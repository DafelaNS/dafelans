function rng(c){if(per=='Todo')return;const d=new Date();d.setHours(0,0,0,0);const a=new Date(d),b=new Date(d);
 if(per=='Hoy')b.setDate(b.getDate()+1);
 else if(per=='Semana'){if(c.fut)b.setDate(b.getDate()+7);else{a.setDate(a.getDate()-6);b.setDate(b.getDate()+1)}}
 else if(c.fut)b.setDate(b.getDate()+30);else{a.setDate(1);b.setMonth(a.getMonth()+1,1)}

async function up(f,png){const b=await createImageBitmap(f),k=Math.min(1,1400/Math.max(b.width,b.height)),c=document.createElement('canvas');
 c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 const ty=png?'image/png':'image/jpeg',bl=await new Promise(r=>c.toBlob(r,ty,.85)),n=Date.now()+(png?'.png':'.jpg'),{error}=await sb.storage.from('trabajos').upload(n,bl,{contentType:ty});

const rr=(x,a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
const spc=(x,t,cx,y,g)=>{const a=[...t].map(c=>x.measureText(c).width),w=a.reduce((s,v)=>s+v,0)+g*(t.length-1);let px=cx-w/2;x.textAlign='left';[...t].forEach((c,i)=>{x.fillText(c,px,y);px+=a[i]+g});x.textAlign='center'};
const wrp=(x,t,mw)=>{const o=[];let l='';for(const w of String(t).split(/\s+/)){const q=l?l+' '+w:w;if(l&&x.measureText(q).width>mw){o.push(l);l=w}else l=q}if(l)o.push(l);return o};
const fit=(x,t,mw,s,wt,fam)=>{while(s>22){x.font=wt+' '+s+'px '+fam;if(x.measureText(t).width<=mw)break;s-=2}};

async function tarjeta(c,aj){

  x.strokeStyle=GOLD;x.lineWidth=2;x.globalAlpha=.55;rr(x,40,40,W-80,H-80,40);x.stroke();x.globalAlpha=1;

  x.fillStyle=CREAM;fit(x,'Hola, '+(c.nombre||''),W-240,40,'300',JO);x.fillText('Hola, '+(c.nombre||''),W/2,y);
  y+=110;x.fillStyle=CREAM;fit(x,dia,W-200,66,'600',CG);x.fillText(dia,W/2,y);
  y+=115;x.fillStyle=GOLD;fit(x,hora,W-200,104,'600',CG);x.fillText(hora,W/2,y);
  y+=95;x.fillStyle=GOLD;x.font='300 24px '+JO;spc(x,'SERVICIOS',W/2,y,10);
  y+=22;x.fillStyle=CREAM;x.font='400 38px '+JO;
  const sl=I.L.length?I.L.map(s=>s.nombre):[I.n];
  sl.forEach(n=>wrp(x,n,W-260).forEach(l=>{y+=54;x.fillText(l,W/2,y)}));

  if(dir){y+=95;x.fillStyle=GOLD;x.font='300 24px '+JO;spc(x,'UBICACIÓN',W/2,y,10);
   y+=18;x.fillStyle=CREAM;x.font='400 34px '+JO;wrp(x,dir,W-260).forEach(l=>{y+=48;x.fillText(l,W/2,y)});
   if(ref){x.fillStyle=MUT;x.font='300 28px '+JO;wrp(x,ref,W-260).forEach(l=>{y+=42;x.fillText(l,W/2,y)})}}
  y+=130;x.fillStyle=GOLD;x.font='84px '+PI;x.fillText('Te esperamos',W/2,y);
  const ct=[aj.whatsapp?'WhatsApp  '+fmtTel(aj.whatsapp):'',aj.instagram?'@'+String(aj.instagram).trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@/,'').replace(/[\/?].*$/,''):''].filter(Boolean).join('     ');

  const p=[aj.pct_inversion??30,aj.pct_duena??50,aj.pct_reserva??20],ps=p.reduce((x,y)=>x+Number(y),0);
  const nom=['Reinversión (material, equipo, publicidad)','Para ti (ganancia de la dueña)','Reserva (imprevistos y meses bajos)'];
  const gc=Object.entries(grp(d.gas,x=>x.categoria)).sort((x,y)=>y[1]-x[1]),im=Object.entries(grp(d.ing,x=>x.metodo)).sort((x,y)=>y[1]-x[1]);
  L.innerHTML=`<select id="fp" class="o">${['Este mes','Mes pasado','Últimos 3 meses','Este año','Todo'].map(x=>`<option${x==fp?' selected':''}>${x}</option>`).join('')}</select>
  <div class="k">${kpis(I,G)}</div>
  <h4>${U>0?'¿Qué hacer con la ganancia?':'Sin ganancia en este periodo'}</h4>
  ${U>0?p.map((x,i)=>`<div class="ln"><span>${nom[i]}<small>${x}% de la ganancia</small></span><b>${money(U*x/100)}</b></div>`).join(''):`<div class="msg">${U<0?`Gastaste ${money(G)} y entraron ${money(I)}: hay una pérdida de ${money(-U)}.`:'Lo que entró fue igual a lo gastado.'} No hay ganancia que repartir. Revisa abajo en qué tipo de gasto se va más.</div>`}
  ${sum(d.ing,'descuento')>0?`<div class="msg">Descuentos otorgados en este periodo: <b>${money(sum(d.ing,'descuento'))}</b> (lo que dejaste de cobrar).</div>`:''}
  <div class="msg">Gastos fijos registrados: <b>${money(fj)}</b> al mes (los semanales, promediados). Tus ingresos del mes deben superar esa cantidad para no perder.</div>
  <h4>Porcentajes del reparto <small>(una guía; ajústala a tu negocio y que sume 100)</small></h4>
  ${nom.map((n,i)=>`<div class="ln"><span>${n}</span><input class="pi" id="p${i}" type="number" step="any" value="${p[i]}"></div>`).join('')}
  <div class="ln"><span class="${Math.round(ps)==100?'pos':'neg'}">Suma: ${ps}%</span><button class="o" id="savepct">Guardar porcentajes</button></div>
  ${comSec(d.ing)}
  <h4>Gastos por tipo</h4>${gc.map(([k,v])=>`<div class="ln"><span>${e(k)}<small>${G?(v/G*100).toFixed(0):0}% del gasto</small></span><b>${money(v)}</b></div>`).join('')||'<p style="color:var(--mut)">Sin gastos en este periodo.</p>'}
  <h4>Ingresos por forma de pago</h4>${im.map(([k,v])=>`<div class="ln"><span>${e(k)}<small>${I?(v/I*100).toFixed(0):0}% del ingreso</small></span><b>${money(v)}</b></div>`).join('')||'<p style="color:var(--mut)">Sin ingresos en este periodo.</p>'}`
 }catch(x){L.innerHTML='<p class="neg">No se pudo cargar: '+e(x.message)+'</p>'}}

/* ---------- dashboard ---------- */
const mk=(id,cfg)=>{const c=$('#'+id);return c&&window.Chart?new Chart(c,cfg):null};
async function vDash(){const L=$('#list');L.innerHTML='<p style="text-align:center;padding:30px">Cargando…</p>';
 ch.forEach(c=>c&&c.destroy());ch=[];sm=null;
 try{if(!window.Chart)throw Error('No cargaron las gráficas. Revisa tu internet y recarga.');
  const d0=new Date(),y=d0.getFullYear(),m=d0.getMonth(),n=dp=='12 meses'?12:dp=='6 meses'?6:m+1;
  DD=await datos([ymd(new Date(y,m-(n-1),1)),ymd(new Date(y,m+1,1))]);
  const ms=[],mi={},mg={};for(let i=0;i<n;i++){const k=ymd(new Date(y,m-(n-1)+i,1)).slice(0,7);ms.push(k);mi[k]=0;mg[k]=0}
  DD.ing.forEach(x=>{const k=x.fecha.slice(0,7);if(k in mi)mi[k]+=Number(x.monto||0)});DD.gas.forEach(x=>{const k=x.fecha.slice(0,7);if(k in mg)mg[k]+=Number(x.monto||0)});
  L.innerHTML=`<select id="dp" class="o">${['6 meses','12 meses','Este año'].map(x=>`<option${x==dp?' selected':''}>${x}</option>`).join('')}</select>
  <div class="k" id="kp"></div><p id="sel" style="color:var(--mut);margin:0"></p>
  <h4>Ingresos, gastos y ganancia <small>toca un mes para filtrar todo</small></h4><div class="cv"><canvas id="c1"></canvas></div>
  <h4>Gastos por tipo</h4><div class="cv"><canvas id="c2"></canvas></div>
  <h4>Ingresos por forma de pago</h4><div class="cv"><canvas id="c3"></canvas></div>
  <h4>Servicios que más dejan</h4><div class="cv"><canvas id="c4"></canvas></div>
  <h4>Resumen por mes</h4>${ms.slice().reverse().map(k=>{const u=mi[k]-mg[k];return`<div class="ln"><span>${ml(k)}<small>Ingresos ${money(mi[k])} · Gastos ${money(mg[k])}</small></span><b class="${u>=0?'pos':'neg'}">${money(u)}</b></div>`}).join('')}
  <div id="det"></div>`;
  ch=[mk('c1',{type:'bar',data:{labels:ms.map(ml),datasets:[{type:'bar',label:'Ingresos',data:ms.map(k=>mi[k]),backgroundColor:'#4e2f1f'},{type:'bar',label:'Gastos',data:ms.map(k=>mg[k]),backgroundColor:'#d3c3ae'},{type:'line',label:'Ganancia',data:ms.map(k=>mi[k]-mg[k]),borderColor:'#b08a4e',backgroundColor:'#b08a4e',tension:.3}]},
   options:{maintainAspectRatio:false,onClick:(ev,els)=>{if(els.length){const k=ms[els[0].index];sm=sm==k?null:k;pie()}},scales:{y:{ticks:{callback:v=>money(v)}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+money(c.parsed.y)}}}}})];
  pie();
 }catch(x){L.innerHTML='<p class="neg">No se pudo cargar: '+e(x.message)+'</p>'}}
function pie(){ch.slice(1).forEach(c=>c&&c.destroy());ch.length=1;
 const fi=sm?DD.ing.filter(x=>x.fecha.startsWith(sm)):DD.ing,fg=sm?DD.gas.filter(x=>x.fecha.startsWith(sm)):DD.gas,I=sum(fi),G=sum(fg);
 $('#kp').innerHTML=kpis(I,G);
 $('#sel').textContent=sm?'Mostrando solo '+ml(sm)+' (toca otra vez la barra para ver todo)':'Mostrando todo el periodo';
 const dn=(id,o)=>{const q=Object.entries(o).sort((x,y)=>y[1]-x[1]);return mk(id,{type:'doughnut',data:{labels:q.map(x=>x[0]),datasets:[{data:q.map(x=>x[1]),backgroundColor:PAL}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>c.label+': '+money(c.parsed)}}}}})};
 ch.push(dn('c2',grp(fg,x=>x.categoria)),dn('c3',grp(fi,x=>x.metodo)));
 const t=Object.entries(grp(fi,x=>x.concepto)).sort((x,y)=>y[1]-x[1]).slice(0,8);
 ch.push(mk('c4',{type:'bar',data:{labels:t.map(x=>x[0]),datasets:[{label:'Ingresos',data:t.map(x=>x[1]),backgroundColor:'#4e2f1f'}]},options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>money(c.parsed.x)}}},scales:{x:{ticks:{callback:v=>money(v)}}}}}));
 $('#det').innerHTML=sm?'<h4>Movimientos de '+ml(sm)+'</h4>'+[...fi.map(x=>({...x,s:'+'})),...fg.map(x=>({...x,s:'−'}))].sort((a,b)=>a.fecha<b.fecha?-1:1).map(x=>`<div class="ln"><span>${e(x.concepto||x.categoria||'')}<small>${e(x.fecha)}</small></span><b class="${x.s=='+'?'pos':'neg'}">${x.s}${money(x.monto)}</b></div>`).join(''):''}

/* ---------- sesión ---------- */
const shell=m=>$('#app').innerHTML=`<div class="top"><h1>DAFELA</h1><button class="o" id="out">Salir</button></div>`+(m||'<div id="tabs"></div><div id="list"></div><button class="fab" id="new">+ Nuevo</button>');
function login(m=''){$('#app').innerHTML=`<div class="top"><h1>DAFELA · control</h1></div><form id="lg"><label>Correo<input name="e" type="email" required></label><label>Contraseña<input name="p" type="password" required></label><p style="color:#a33">${m}</p><div class="bt"><button class="ok">Entrar</button></div></form>`;
 $('#lg').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),{error}=await sb.auth.signInWithPassword({email:f.get('e').trim(),password:f.get('p')});error?login('Correo o contraseña incorrectos.'):start()}}
async function start(){const{data:{session}}=await sb.auth.getSession();if(!session)return login();
 const{data:r}=await sb.rpc('mi_rol');role=r;if(!role)return shell('<p>Este correo no tiene acceso al control.</p>');
 sv=(await sb.from('servicios').select('id,categoria,nombre,duracion_min,precio').order('id')).data||[];await nmLoad();shell();load()}
document.addEventListener('click',async ev=>{const t=ev.target,r=t.closest('.row');
 if(t.dataset.t){tab=t.dataset.t;load()}
 else if(t.id=='new')form();
 else if(t.id=='out'){await sb.auth.signOut();login()}
 else if(t.id=='savepct'){const v=[0,1,2].map(i=>Number($('#p'+i).value||0));
  if(Math.round(v[0]+v[1]+v[2])!=100)return alert('Los porcentajes deben sumar 100.');
  const{error}=await sb.from('ajustes').upsert({id:1,pct_inversion:v[0],pct_duena:v[1],pct_reserva:v[2]});if(error)return alert(error.message);vFin()}
 else if(t.id=='pagosem')pagoSemanal()
 else if(t.id=='genfijos'){const hoy=new Date();hoy.setHours(0,0,0,0);const y=hoy.getFullYear(),m=hoy.getMonth(),ini=ymd(new Date(y,m,1)),sig=ymd(new Date(y,m+1,1));
  const[a,b]=await Promise.all([sb.from('gastos_fijos').select('*').eq('activo',true),sb.from('gastos').select('fijo_id,fecha').not('fijo_id','is',null).gte('fecha',ini).lt('fecha',sig)]);
  if(a.error)return alert(a.error.message);
  const keys=new Set((b.data||[]).map(x=>x.fijo_id+'|'+x.fecha)),mes=new Set((b.data||[]).map(x=>x.fijo_id)),nuevos=[];
  for(const x of a.data||[]){
   if(x.frecuencia=='Semanal'){const wd=DIAS[x.dia_semana||'Sábado'];
    for(const d=new Date(y,m,1);d<=hoy&&d.getMonth()==m;d.setDate(d.getDate()+1)){if(d.getDay()!=wd)continue;const fe=ymd(d);if(!keys.has(x.id+'|'+fe))nuevos.push({fecha:fe,categoria:x.categoria,concepto:x.concepto,monto:x.monto,fijo_id:x.id})}}
   else if(!mes.has(x.id))nuevos.push({fecha:ini.slice(0,8)+String(Math.min(x.dia||1,28)).padStart(2,'0'),categoria:x.categoria,concepto:x.concepto,monto:x.monto,fijo_id:x.id})}
  if(!nuevos.length)return alert('Los gastos fijos de este mes ya están registrados (o no hay fijos activos).');
  if(!confirm('Se agregarán '+nuevos.length+' gastos fijos (los semanales, solo hasta hoy). ¿Continuar?'))return;
  const{error}=await sb.from('gastos').insert(nuevos);if(error)return alert(error.message);tab='gastos';load()}
 else if(t.dataset.cobrar){const x=rows[r.dataset.i];if(!await cobro(x.id,{servicios_ids:x.servicios_ids,servicio_id:x.servicio_id,fecha_hora:x.fecha_hora,atiende:x.atiende},x.clientas?.nombre))alert('Esa cita ya está cobrada.')}
 else if(t.dataset.conf){const x=rows[r.dataset.i];confirmar({nombre:x.clientas?.nombre,tel:x.clientas?.telefono,fecha_hora:x.fecha_hora,ids:svIds(x.servicios_ids,x.servicio_id),dur:x.duracion_min})}
 else if(t.classList.contains('st')){const x=rows[r.dataset.i],n=Math.max(0,(x.cantidad||0)+Number(t.dataset.d));await sb.from('inventario').update({cantidad:n}).eq('id',x.id);x.cantidad=n;draw()}
 else if(r)form(rows[r.dataset.i])});
document.addEventListener('change',ev=>{const i=ev.target.id,v=ev.target.value;
 if(i=='per'){per=v;load()}else if(i=='fp'){fp=v;vFin()}else if(i=='dp'){dp=v;vDash()}});
document.addEventListener('input',ev=>{if(ev.target.id!='q')return;const q=norm(ev.target.value.trim());document.querySelectorAll('#list .row').forEach(r=>{r.style.display=!q||r.dataset.q.includes(q)?'':'none'})});
start();
</script></body></html>
