<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dafela Nail House</title>
<meta name="theme-color" content="#3b2216">
<meta name="description" content="Dafela Nail House: servicios, trabajos, promociones, ubicación y agenda de citas.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4eee5;--card:#e9dfd0;--ink:#3b2216;--choc:#4e2f1f;--mut:#6e5a49;--line:#d3c3ae;--gold:#b08a4e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.6 Jost,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{text-align:center;padding:calc(46px + env(safe-area-inset-top)) 20px 28px}
h1{font:400 clamp(3.4rem,17vw,6rem)/1 'Cormorant Garamond',serif;letter-spacing:.06em;margin:0;color:var(--choc)}
.sub{letter-spacing:.55em;text-indent:.55em;font-size:.78rem;margin:10px 0 0;color:var(--choc)}
.lema{font:italic 1.25rem 'Cormorant Garamond',serif;color:var(--mut);margin:16px 0 0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-block:1px solid var(--line);scrollbar-width:none}
nav a{flex:none;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 18px;font-size:.92rem}
main{max-width:720px;margin:auto;padding:0 18px 90px}
section{padding-top:38px;scroll-margin-top:52px}
h2{font:400 2.8rem/1.1 'Pinyon Script','Cormorant Garamond',serif;color:var(--choc);margin:0 0 14px}
details{background:var(--card);border-radius:16px;margin-bottom:10px;padding:0 18px}
summary{padding:15px 0;font:600 1.4rem 'Cormorant Garamond',serif;color:var(--choc);cursor:pointer}
.it{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.it small{color:var(--mut);white-space:nowrap;font-size:.9rem}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.bans{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.ban{flex:0 0 88%;margin:0;scroll-snap-align:center}
.bans.one .ban{flex-basis:100%}
.ban img{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 6px 18px #3b221626}
.ban figcaption{color:var(--mut);font-size:.88rem;text-align:center;margin-top:8px}
.promo{background:var(--card);border-radius:16px;padding:18px;margin-bottom:10px}
.promo b{font:600 1.4rem 'Cormorant Garamond',serif}.promo p{margin:6px 0 0}.promo small{color:var(--mut)}
iframe{width:100%;height:270px;border:0;border-radius:16px;margin-top:12px}
.btn{display:inline-block;margin:12px 8px 0 0;background:var(--ink);color:#fff;border-radius:99px;padding:11px 24px;text-decoration:none;border:0;font:inherit;cursor:pointer}
.btn[disabled]{opacity:.4;cursor:default}
a:focus-visible,summary:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.ag{background:var(--card);border-radius:16px;padding:18px}
.ag label{display:block;font-size:.88rem;color:var(--mut);margin-top:10px}
.ag select,.ag input{display:block;width:100%;margin-top:4px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;margin-top:6px}
.d,.s{flex:none;border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;text-align:center;font:inherit;color:var(--ink);cursor:pointer;line-height:1.3}
.d{min-width:58px}.d small{color:var(--mut)}
.d.on,.s.on{background:var(--ink);color:#fff;border-color:var(--ink)}.d.on small{color:#e3dacd}
.d:disabled{opacity:.35;cursor:default}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin:8px 0}
.s{cursor:default}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px;font:inherit;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.nv{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px}
.nv b{font-weight:400;text-transform:capitalize;text-align:center}
.nv button{flex:none;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:1.2rem;line-height:1;color:var(--ink);cursor:pointer}
.nv button:disabled{opacity:.3;cursor:default}
.wk{border-top:1px solid var(--line);padding:8px 0}.wk>b{font-weight:400;display:block;margin-bottom:4px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mg .h{font-size:.75rem;color:var(--mut);text-align:center}
.cell{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 0;text-align:center;font:inherit;color:var(--ink);line-height:1.25;min-height:54px;cursor:pointer}
.cell small{display:block;font-size:.62rem}
.cell.ok small{color:#2f6b3d}.cell.few small{color:#8a5a00}.cell.full small{color:#a33}
.cell:disabled{opacity:.4;cursor:default}
.hint{color:var(--mut);font-size:.92rem;margin:8px 0}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:99px;padding:12px 22px;text-decoration:none;box-shadow:0 4px 14px #0004;z-index:6}
footer{text-align:center;color:var(--mut);padding:10px 20px 40px;font:italic 1.05rem 'Cormorant Garamond',serif}
</style></head><body>
<header><h1>DAFELA</h1><p class="sub">NAIL HOUSE</p><p class="lema" id="lema"></p></header>
<nav id="nav" aria-label="Secciones"></nav>
<main id="m"><p style="text-align:center;padding:40px">Cargando…</p></main>
<footer>Uñas auténticas para versiones reales de ti</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const U="https://kttoubqetucnsfmpauug.supabase.co",K="sb_publishable_O6RnBiuRbNv86fP60dFb6w__94gJowB";
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dur=m=>!m?'':m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':'');
const money=n=>'$'+Number(n).toLocaleString('es-MX');
const hoy=new Date().toLocaleDateString('sv');
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const t12=s=>{const[h,m]=s.split(':').map(Number);return(h%12||12)+(m?':'+String(m).padStart(2,'0'):'')+(h<12?' am':' pm')};

async function initAg(cl,sv,hp,wa,ig){const root=$('#ag-root');
 const d0=new Date();d0.setHours(0,0,0,0);
 const addD=(x,n)=>{const r=new Date(x);r.setDate(r.getDate()+n);return r};
 const dmax=addD(d0,89),cur={sv:null,mode:'dia',day:d0};
 const contacto=`<p class="hint">El horario es de inicio; si tu servicio es largo, te confirmamos por mensaje si alcanza. Para apartar, escríbenos:</p>${wa?`<a class="btn" href="https://wa.me/${wa}">WhatsApp</a>`:''}${ig?`<a class="btn" href="https://ig.me/m/${encodeURIComponent(ig)}">Instagram</a>`:''}`;
 const rg={desde:d0.toISOString(),hasta:addD(dmax,1).toISOString()},[{data,error},bl]=await Promise.all([cl.rpc('ocupado',rg),cl.rpc('bloqueos_ocupado',rg)]);
 if(error){root.innerHTML=contacto;return}
 const busy=[...(data||[]),...(bl.error?[]:bl.data||[])].map(x=>({i:+new Date(x.inicio),f:+new Date(x.inicio)+(x.duracion_min||60)*6e4}));
 const abierto=x=>{const w=hp.semana[x.getDay()];return!!(w&&w[0]&&w[1])};
 const slots=day=>{const w=hp.semana[day.getDay()];if(!w||!w[0]||!w[1])return[];
  const[h1,m1]=w[0].split(':').map(Number),[h2,m2]=w[1].split(':').map(Number),o=new Date(day),c=new Date(day);
  o.setHours(h1,m1,0,0);c.setHours(h2,m2,0,0);
  const du=(cur.sv?.duracion_min||60)*6e4,st=(hp.intervalo||30)*6e4,min=Date.now()+(hp.anticipacion??3)*36e5,out=[];
  for(let t=+o;t<+c;t+=st){if(t<min)continue;if(busy.some(b=>t<b.f&&t+du>b.i))continue;out.push(t)}return out};
 const dl=[...Array(90)].map((_,i)=>addD(d0,i));
 cur.day=dl.find(x=>slots(x).length)||dl.find(abierto)||d0;
 const ws=x=>addD(x,-((x.getDay()+6)%7));
 const mon=x=>x.toLocaleDateString('es-MX',{month:'short'}).replace('.','');
 const lab=x=>x.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
 const fT=t=>new Date(t).toLocaleTimeString('es-MX',{hour:'numeric',minute:'2-digit',hour12:true});
 const chips=x=>{const s=slots(x);return s.length?`<div class="slots">${s.map(t=>`<span class="s">${fT(t)}</span>`).join('')}</div>`:''};
 root.innerHTML=`<label>Servicio (ajusta los horarios a su duración)<select id="ag-sv"><option value="">Cualquiera</option>${sv.map((s,i)=>`<option value="${i}">${e(s.nombre)}${s.duracion_min?' · '+dur(s.duracion_min):''}</option>`).join('')}</select></label>
 <div id="ag-v"></div>${contacto}`;
 const vista=()=>{const x=cur.day,m=cur.mode;let ttl,prev,next,body,okp,okn;
  if(m=='dia'){ttl=lab(x);prev=addD(x,-1);next=addD(x,1);
   body=!abierto(x)?'<p class="hint">Ese día no abrimos.</p>':chips(x)||'<p class="hint">No hay horarios libres ese día. Prueba con otro.</p>';
   const ok=t=>t>=d0&&t<=dmax;okp=ok(prev);okn=ok(next)}
  else if(m=='semana'){const a=ws(x),z=addD(a,6);ttl=`${a.getDate()} ${mon(a)} – ${z.getDate()} ${mon(z)}`;prev=addD(a,-7);next=addD(a,7);
   body=[0,1,2,3,4,5,6].map(i=>addD(a,i)).filter(t=>t>=d0&&t<=dmax).map(t=>`<div class="wk"><b>${DN[t.getDay()]} ${t.getDate()}</b>${!abierto(t)?'<span class="hint"> · Cerrado</span>':chips(t)||'<span class="hint"> · Sin horarios libres</span>'}</div>`).join('')||'<p class="hint">Sin días disponibles.</p>';
   const ok=t=>{const w=ws(t);return addD(w,6)>=d0&&w<=dmax};okp=ok(prev);okn=ok(next)}
  else{const y=x.getFullYear(),mo=x.getMonth(),f=new Date(y,mo,1),nd=new Date(y,mo+1,0).getDate();
   ttl=f.toLocaleDateString('es-MX',{month:'long',year:'numeric'});prev=new Date(y,mo-1,1);next=new Date(y,mo+1,1);
   let g=['L','M','M','J','V','S','D'].map(l=>`<span class="h">${l}</span>`).join('')+'<span></span>'.repeat((f.getDay()+6)%7);
   for(let d=1;d<=nd;d++){const t=new Date(y,mo,d),off=t<d0||t>dmax||!abierto(t);let c='x',tx='';
    if(!off){const n=slots(t).length;c=n==0?'full':n<=3?'few':'ok';tx=n==0?'Lleno':n<=3?'Pocos':'Libre'}
    g+=`<button class="cell ${c}" data-t="${+t}"${off?' disabled':''}>${d}<small>${tx}</small></button>`}
   body=`<div class="mg">${g}</div><p class="hint">Toca un día para ver sus horarios.</p>`;
   const ok=t=>new Date(t.getFullYear(),t.getMonth()+1,0)>=d0&&t<=dmax;okp=ok(prev);okn=ok(next)}
  $('#ag-v').innerHTML=`<div class="seg">${[['dia','Día'],['semana','Semana'],['mes','Mes']].map(([k,l])=>`<button data-m="${k}"${k==m?' class="on"':''}>${l}</button>`).join('')}</div>
  <div class="nv"><button data-to="${+prev}" aria-label="Anterior"${okp?'':' disabled'}>‹</button><b>${ttl}</b><button data-to="${+next}" aria-label="Siguiente"${okn?'':' disabled'}>›</button></div>${body}`};
 vista();
 root.addEventListener('change',ev=>{if(ev.target.id=='ag-sv'){cur.sv=ev.target.value===''?null:sv[+ev.target.value];vista()}});
 root.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.m){cur.mode=b.dataset.m;if(cur.day<d0)cur.day=d0;if(cur.day>dmax)cur.day=dmax;vista()}
  else if(b.dataset.to){cur.day=new Date(+b.dataset.to);vista()}
  else if(b.dataset.t){cur.day=new Date(+b.dataset.t);cur.mode='dia';vista()}})}

(async()=>{const m=$('#m');try{
  const cl=supabase.createClient(U,K);
  const[{data:d,error},{data:hp},{data:pp,error:pe}]=await Promise.all([cl.rpc('catalogo'),cl.rpc('horario_publico'),cl.rpc('promos_publicas')]);if(error)throw error;
  const a=d.ajustes||{},sv=d.servicios||[],fo=d.fotos||[],pr=((!pe&&Array.isArray(pp))?pp:(d.promociones||[])).filter(p=>!p.vigente_hasta||p.vigente_hasta>=hoy),n=[];
  const cats=[...new Set(sv.map(s=>s.categoria))];let h='';
  $('#lema').textContent=a.lema||'';
  if(cats.length){n.push(['sv','Servicios']);
    h+=`<section id="sv"><h2>Servicios</h2>${cats.map(c=>`<details><summary>${e(c)}</summary>${sv.filter(s=>s.categoria==c).map(s=>`<div class="it"><span>${e(s.nombre)}</span><small>${s.precio!=null&&s.precio!==''?money(s.precio)+(s.duracion_min?' · ':''):''}${dur(s.duracion_min)}</small></div>`).join('')}</details>`).join('')}</section>`}
  if(fo.length){n.push(['tr','Trabajos']);
    h+=`<section id="tr"><h2>Nuestros trabajos</h2><div class="gal">${fo.map(f=>`<img loading="lazy" src="${e(f.url)}" alt="${e(f.titulo||'Trabajo de Dafela')}">`).join('')}</div></section>`}
  if(pr.length){n.push(['pr','Promociones']);
    const vh=p=>p.vigente_hasta?'Válida hasta '+new Date(p.vigente_hasta+'T00:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'long'}):'';
    const im=pr.filter(p=>p.imagen_url),tx=pr.filter(p=>!p.imagen_url);
    h+=`<section id="pr"><h2>Promociones</h2>${im.length?`<div class="bans${im.length==1?' one':''}">${im.map(p=>`<figure class="ban"><img loading="lazy" src="${e(p.imagen_url)}" alt="${e(p.titulo||'Promoción')}">${vh(p)?`<figcaption>${e(vh(p))}</figcaption>`:''}</figure>`).join('')}</div>${im.length>1?'<p class="hint" style="text-align:center">Desliza para ver más promociones</p>':''}`:''}${tx.map(p=>`<div class="promo"><b>${e(p.titulo)}</b>${p.descripcion?`<p>${e(p.descripcion)}</p>`:''}${vh(p)?`<small>${e(vh(p))}</small>`:''}</div>`).join('')}</section>`}
  const wa=(a.whatsapp||'').replace(/\D/g,''),ig0=(a.instagram||'').trim();
  const agOk=!!((wa||ig0)&&sv.length&&hp?.semana&&Object.values(hp.semana).some(v=>v&&v[0]&&v[1]));
  if(agOk){n.push(['ag','Horarios']);h+=`<section id="ag"><h2>Horarios disponibles</h2><div class="ag" id="ag-root"></div></section>`}
  const mp=(a.mapa_url||'').match(/https:\/\/www\.google\.com\/maps\/embed[^"'\s>]*/)?.[0];
  const ig=(a.instagram||'').trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/^@/,'').replace(/[\/?].*$/,'');
  const hz=hp?.semana?[1,2,3,4,5,6,0].filter(i=>hp.semana[i]?.[0]&&hp.semana[i]?.[1]).map(i=>DN[i]+' '+t12(hp.semana[i][0])+' – '+t12(hp.semana[i][1])).join('\n'):'';
  const hor=hz||a.horario;
  if(a.direccion||mp||wa||ig||hor){n.push(['ub','Ubicación']);
    h+=`<section id="ub"><h2>Visítanos</h2>${a.direccion?`<p><b>${e(a.direccion)}</b></p>`:''}${a.referencias?`<p>${e(a.referencias)}</p>`:''}${hor?`<p style="white-space:pre-line">${e(hor)}</p>`:''}${mp?`<iframe loading="lazy" src="${e(mp)}" title="Mapa del salón"></iframe>`:''}${a.direccion?`<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(a.direccion)}">Cómo llegar</a>`:''}${wa?`<a class="btn" href="https://wa.me/${wa}">WhatsApp</a>`:''}${ig?`<a class="btn" href="https://instagram.com/${encodeURIComponent(ig)}">Instagram</a>`:''}</section>`}
  if(agOk)h+=`<a class="fab" href="#ag">Ver horarios</a>`;
  m.innerHTML=h||'<p style="text-align:center;padding:40px">Muy pronto verás aquí nuestros servicios.</p>';
  $('#nav').innerHTML=n.map(([i,l])=>`<a href="#${i}">${l}</a>`).join('');
  if(agOk)initAg(cl,sv,hp,wa,ig);
}catch{m.innerHTML='<p style="text-align:center;padding:40px">No se pudo cargar la página. Recarga e intenta de nuevo.</p>'}})();
</script></body></html>
